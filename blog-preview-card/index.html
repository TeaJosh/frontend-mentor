<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Blog preview card</title>
  </head>
  <body>
    <main>
      <article class="blog-card">
        <div class="card-banner">
          <img
            src="./assets/images/illustration-article.svg"
            alt="Blog card featured image"
          />
          <span class="category-badge">Learning</span>
        </div>

        <div class="card-content">
          <div class="card-meta">
            <time datetime="2023-12-21">Published 21 Dec 2023</time>
          </div>

          <h3 class="card-title">HTML &amp; CSS foundations</h3>
          <p class="card-excerpt">
            These languages are the backbone of every website, defining structure,
            content, and presentation.
          </p>

          <div class="card-author">
            <img
              src="./assets/images/image-avatar.jpg"
              alt="Greg Hooper"
              class="author-avatar"
            />
            <div class="author-info">
              <span class="author-name">Greg Hooper</span>
            </div>
          </div>
        </div>
      </article>
    </main>
  </body>
</html>
