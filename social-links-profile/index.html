<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Social links profile</title>
  </head>
  <body>
    <main>
      <article class="profile-card">
        <div class="profile-image">
          <img
            src="./assets/images/avatar-jessica.jpeg"
            alt="Jessica Randall"
          />
        </div>

        <div class="card-content">
          <h1 class="card-title">Jessica Randall</h1>
          <p class="card-subtitle">London, United Kingdom</p>
          <p class="card-excerpt">"Front-end developer and avid reader."</p>
        </div>

        <nav class="social-links">
          <a href="#" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a href="#" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>
          <a href="#" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="#" target="_blank" rel="noopener noreferrer">Twitter</a>
          <a href="#" target="_blank" rel="noopener noreferrer">Instagram</a>
        </nav>
      </article>
    </main>
  </body>
</html>
